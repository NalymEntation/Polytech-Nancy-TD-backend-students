openapi: 3.0.0
info:
    title: Todo App API
    version: 1.0.0
    description: API de gestion des tâches
servers:
    - url: http://localhost:8080
paths:
    /tasks:
        get:
            summary: Récupérer toutes les tâches
            responses:
                '200':
                    description: Liste des tâches
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TaskResponseDto'
                '500':
                    description: Erreur serveur
        post:
            summary: Créer une tâche
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskCreationDto'
            responses:
                '201':
                    description: Tâche créée
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaskResponseDto'
                '400':
                    description: Erreur de validation (ex. titre > 50 caractères)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponseDto'
                '500':
                    description: Erreur serveur
        delete:
            summary: Supprimer toutes les tâches
            responses:
                '204':
                    description: Tâches supprimées
                '500':
                    description: Erreur serveur

    /tasks/{id}:
        get:
            summary: Récupérer une tâche par son ID
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Détails de la tâche
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaskResponseDto'
                '404':
                    description: Tâche non trouvée
                '500':
                    description: Erreur serveur
        put:
            summary: Mettre à jour une tâche
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskUpdateDto'
            responses:
                '204':
                    description: Tâche mise à jour
                '400':
                    description: Erreur de validation
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponseDto'
                '404':
                    description: Tâche non trouvée
                '500':
                    description: Erreur serveur
        delete:
            summary: Supprimer une tâche
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                '204':
                    description: Tâche supprimée
                '404':
                    description: Tâche non trouvée
                '500':
                    description: Erreur serveur

    /tasks/count:
        get:
            summary: Obtenir le nombre total de tâches
            responses:
                '200':
                    description: Le compte des tâches
                    content:
                        application/json:
                            schema:
                                type: integer
                '500':
                    description: Erreur serveur

components:
    schemas:
        TaskCreationDto:
            type: object
            required:
                - title
            properties:
                title:
                    type: string
                    maxLength: 50
                description:
                    type: string
                    maxLength: 255

        TaskUpdateDto:
            type: object
            required:
                - title
                - done
            properties:
                title:
                    type: string
                    maxLength: 50
                description:
                    type: string
                    maxLength: 255
                done:
                    type: boolean

        TaskResponseDto:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                description:
                    type: string
                done:
                    type: boolean

        ErrorResponseDto:
            type: object
            properties:
                field:
                    type: string
                message:
                    type: string